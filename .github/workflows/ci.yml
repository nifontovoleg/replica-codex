name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Install into an isolated directory
        run: python scripts/install_codex.py --dest .test-artifacts/skills
      - name: Verify installed files
        run: python scripts/install_codex.py --check --dest .test-artifacts/skills
      - name: Exercise installed tools
        run: python scripts/smoke_codex.py --skills-dir .test-artifacts/skills
      - name: Build the Codex plugin
        run: python scripts/build_plugin.py --out .test-artifacts/plugin
      - name: Exercise bundled plugin tools
        run: python scripts/smoke_codex.py --skills-dir .test-artifacts/plugin/skills
